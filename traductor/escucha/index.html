<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<title>Traducción en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Pensada para leer en el teléfono durante un evento: letra grande, alto contraste, modo claro para exteriores. */
:root{
  --bg:#0a0a0a; --bar:#121212; --line:#262626; --text:#f2f2f2; --old:#a8a8a8; --dim:#777;
  --accent:#e8a020; --accent2:#20c8e8; --green:#20e880; --red:#e85040;
  --size:22px;
  --f-head:"Bebas Neue",Impact,sans-serif;
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans CJK SC","Noto Sans Devanagari",sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#fbfaf7; --bar:#fff; --line:#e4e1da; --text:#141414; --old:#5e5e5e; --dim:#8a8a8a; --accent:#b06f00; --accent2:#00809a; --green:#0a9a50;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- pantallas de entrada ---------- */
.screen{max-width:560px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 32px;display:flex;flex-direction:column;min-height:100dvh}
.brand{font-family:var(--f-head);font-size:18px;letter-spacing:.08em;color:var(--dim)}
.brand b{color:var(--accent);font-weight:400}
.evt{font-size:clamp(26px,7vw,34px);font-weight:700;line-height:1.15;margin:18px 0 4px;text-wrap:balance}
.lead{color:var(--old);font-size:18px;margin:0 0 20px}
.lead span{display:block;font-size:14px;color:var(--dim);margin-top:2px}
.langs{display:flex;flex-direction:column;gap:10px}
.lang{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:18px 18px;border-radius:14px;border:1px solid var(--line);background:var(--bar);font-size:21px;font-weight:500;text-align:left;cursor:pointer}
.lang:active{transform:scale(.99)}
.lang small{font-size:13px;color:var(--dim);font-weight:400}
.lang.was{border-color:var(--accent2)}
.lang::after{content:"›";font-size:28px;color:var(--dim);line-height:1}
.codeform{display:flex;gap:10px;margin-top:8px}
.codeform input{flex:1;min-width:0;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--bar);font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.codeform input:focus{outline:none;border-color:var(--accent)}
.codeform button,.btn{padding:14px 20px;border-radius:12px;border:1px solid var(--accent);background:none;color:var(--accent);font-weight:700;cursor:pointer}
.msg{margin-top:12px;color:var(--red);min-height:1.4em}
.foot{margin-top:auto;padding-top:28px;font-size:12px;color:var(--dim)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- vista de subtítulos ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px}
.bar .st{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
.dot.live{background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 2s infinite}
.dot.wait{background:var(--accent)}
@keyframes pulse{50%{opacity:.55}}
.st .txt{min-width:0}
.st .t1{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .t2{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;height:40px;min-width:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;font-size:15px;font-weight:700;display:grid;place-items:center}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#feed{max-width:760px;margin:0 auto;padding:18px 18px calc(120px + env(safe-area-inset-bottom));font-size:var(--size);line-height:1.45}
#feed p{margin:0 0 .75em;color:var(--old);text-wrap:pretty}
#feed p:last-of-type{color:var(--text)}
#cur{color:var(--text);font-weight:500}
#cur:not(:empty)::after{content:"";display:inline-block;width:.45em;height:.9em;margin-left:.15em;background:var(--accent2);vertical-align:-.08em;animation:pulse 1s infinite}
.notice{color:var(--dim);font-size:16px;text-align:center;padding:30px 10px}
#jump{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;padding:12px 18px;border-radius:999px;border:none;background:var(--accent2);color:#001418;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.35);cursor:pointer}
</style>
</head>
<body>

<!-- código de sala (si no viene en el enlace) -->
<section class="screen" id="scrCode" hidden>
  <div class="brand"><b>FADER</b>LAB</div>
  <h1 class="evt" data-i="enter">Escribe el código de la sala</h1>
  <form class="codeform" id="codeForm">
    <input id="codeIn" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Código">
    <button data-i="join">Entrar</button>
  </form>
  <div class="msg" id="codeMsg"></div>
  <div class="foot">faderlab.mx</div>
</section>

<!-- cargando -->
<section class="screen" id="scrLoad"><div class="brand"><b>FADER</b>LAB</div><div class="spin"></div></section>

<!-- elegir idioma -->
<section class="screen" id="scrPick" hidden>
  <div class="brand"><b>FADER</b>LAB</div>
  <h1 class="evt" id="pickTitle"></h1>
  <p class="lead" id="pickLead"></p>
  <div class="langs" id="langList"></div>
  <div class="foot" data-i="hint">Subtítulos en vivo. Deja esta página abierta.</div>
</section>

<!-- evento terminado -->
<section class="screen" id="scrEnd" hidden>
  <div class="brand"><b>FADER</b>LAB</div>
  <h1 class="evt" id="endTitle"></h1>
  <p class="lead" data-i="ended">Este evento terminó. ¡Gracias por acompañarnos!</p>
</section>

<!-- subtítulos -->
<div id="scrLive" hidden>
  <div class="bar">
    <div class="st"><i class="dot" id="dot"></i><div class="txt"><div class="t1" id="barTitle"></div><div class="t2" id="barState"></div></div></div>
    <button class="ib" id="smaller" aria-label="A-">A−</button>
    <button class="ib" id="bigger" aria-label="A+">A+</button>
    <button class="ib" id="theme" aria-label="Tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="ib" id="changeLang" aria-label="Idioma"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></button>
  </div>
  <main id="feed" aria-live="polite"><div id="lines"></div><span id="cur"></span><div class="notice" id="notice"></div></main>
  <button id="jump" hidden data-i="latest">Volver a lo último</button>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const DEFAULT_WORKER = "https://traductor-api.faderlab.mx";
const params = new URLSearchParams(location.search);
// Solo en pruebas locales se acepta otro Worker por URL.
const API = (/^(localhost|127\.)/.test(location.hostname) && params.get("api")) ? params.get("api").replace(/\/+$/, "") : DEFAULT_WORKER;

const NATIVE = { en: "English", es: "Español", pt: "Português", fr: "Français", de: "Deutsch", it: "Italiano", ja: "日本語", zh: "中文", ko: "한국어", ru: "Русский", hi: "हिन्दी", id: "Bahasa Indonesia", vi: "Tiếng Việt" };
// textos de la interfaz en cada idioma de salida
const KEYS = ["choose", "waiting", "paused", "live", "reconnecting", "change", "ended", "notfound", "enter", "join", "latest", "original", "hint"];
const T = Object.fromEntries(Object.entries({
  en: ["Choose your language", "Waiting for the speaker…", "Translation paused", "Live", "Reconnecting…", "Language", "This event has ended. Thank you for joining!", "Room not found. Check the code.", "Enter the room code", "Join", "Back to live", "Original language", "Live captions. Keep this page open."],
  es: ["Elige tu idioma", "Esperando al orador…", "Traducción en pausa", "En vivo", "Reconectando…", "Idioma", "Este evento terminó. ¡Gracias por acompañarnos!", "Sala no encontrada. Revisa el código.", "Escribe el código de la sala", "Entrar", "Volver a lo último", "Idioma original", "Subtítulos en vivo. Deja esta página abierta."],
  pt: ["Escolha seu idioma", "Aguardando o palestrante…", "Tradução em pausa", "Ao vivo", "Reconectando…", "Idioma", "Este evento terminou. Obrigado pela presença!", "Sala não encontrada. Verifique o código.", "Digite o código da sala", "Entrar", "Voltar ao vivo", "Idioma original", "Legendas ao vivo. Mantenha esta página aberta."],
  fr: ["Choisissez votre langue", "En attente de l'intervenant…", "Traduction en pause", "En direct", "Reconnexion…", "Langue", "Cet événement est terminé. Merci de votre présence !", "Salle introuvable. Vérifiez le code.", "Saisissez le code de la salle", "Entrer", "Revenir au direct", "Langue d'origine", "Sous-titres en direct. Gardez cette page ouverte."],
  de: ["Wählen Sie Ihre Sprache", "Warten auf den Redner…", "Übersetzung pausiert", "Live", "Verbindung wird wiederhergestellt…", "Sprache", "Diese Veranstaltung ist beendet. Danke für Ihre Teilnahme!", "Raum nicht gefunden. Prüfen Sie den Code.", "Raumcode eingeben", "Beitreten", "Zurück zu live", "Originalsprache", "Live-Untertitel. Lassen Sie diese Seite geöffnet."],
  it: ["Scegli la tua lingua", "In attesa del relatore…", "Traduzione in pausa", "In diretta", "Riconnessione…", "Lingua", "Questo evento è terminato. Grazie per la partecipazione!", "Sala non trovata. Controlla il codice.", "Inserisci il codice della sala", "Entra", "Torna alla diretta", "Lingua originale", "Sottotitoli in diretta. Tieni aperta questa pagina."],
  ja: ["言語を選んでください", "話者を待っています…", "翻訳は一時停止中です", "ライブ", "再接続中…", "言語", "このイベントは終了しました。ご参加ありがとうございました。", "ルームが見つかりません。コードを確認してください。", "ルームコードを入力", "参加", "最新に戻る", "元の言語", "ライブ字幕です。このページを開いたままにしてください。"],
  zh: ["选择您的语言", "等待演讲者…", "翻译已暂停", "直播中", "正在重新连接…", "语言", "本次活动已结束，感谢参与！", "未找到房间，请检查代码。", "输入房间代码", "加入", "回到最新", "原始语言", "实时字幕，请保持此页面打开。"],
  ko: ["언어를 선택하세요", "발표자를 기다리는 중…", "번역 일시 중지", "라이브", "다시 연결 중…", "언어", "이 행사는 종료되었습니다. 참여해 주셔서 감사합니다!", "방을 찾을 수 없습니다. 코드를 확인하세요.", "방 코드를 입력하세요", "참여", "최신으로 이동", "원래 언어", "실시간 자막입니다. 이 페이지를 열어 두세요."],
  ru: ["Выберите язык", "Ожидание выступающего…", "Перевод приостановлен", "В эфире", "Переподключение…", "Язык", "Мероприятие завершено. Спасибо за участие!", "Комната не найдена. Проверьте код.", "Введите код комнаты", "Войти", "К последнему", "Язык оригинала", "Субтитры в реальном времени. Не закрывайте эту страницу."],
  hi: ["अपनी भाषा चुनें", "वक्ता की प्रतीक्षा…", "अनुवाद रुका हुआ है", "लाइव", "फिर से कनेक्ट हो रहा है…", "भाषा", "यह कार्यक्रम समाप्त हो गया है। शामिल होने के लिए धन्यवाद!", "रूम नहीं मिला। कोड जाँचें।", "रूम कोड दर्ज करें", "जुड़ें", "लाइव पर लौटें", "मूल भाषा", "लाइव सबटाइटल। यह पेज खुला रखें।"],
  id: ["Pilih bahasa Anda", "Menunggu pembicara…", "Terjemahan dijeda", "Langsung", "Menyambung ulang…", "Bahasa", "Acara ini telah berakhir. Terima kasih telah bergabung!", "Ruang tidak ditemukan. Periksa kodenya.", "Masukkan kode ruang", "Gabung", "Kembali ke siaran langsung", "Bahasa asli", "Teks langsung. Biarkan halaman ini tetap terbuka."],
  vi: ["Chọn ngôn ngữ của bạn", "Đang chờ diễn giả…", "Bản dịch tạm dừng", "Trực tiếp", "Đang kết nối lại…", "Ngôn ngữ", "Sự kiện đã kết thúc. Cảm ơn bạn đã tham gia!", "Không tìm thấy phòng. Hãy kiểm tra mã.", "Nhập mã phòng", "Tham gia", "Về mới nhất", "Ngôn ngữ gốc", "Phụ đề trực tiếp. Hãy giữ trang này mở."],
}).map(([k, arr]) => [k, Object.fromEntries(KEYS.map((key, i) => [key, arr[i]]))]));
const deviceLang = (navigator.language || "es").slice(0, 2).toLowerCase();
let uiLang = T[deviceLang] ? deviceLang : "en";
const t = (k) => (T[uiLang] || T.en)[k];
function applyI18n() {
  document.documentElement.lang = uiLang;
  document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
}

const store = {
  get(k, d) { try { const v = localStorage.getItem("escucha." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("escucha." + k, JSON.stringify(v)); } catch {} },
};
function show(id) { ["scrCode", "scrLoad", "scrPick", "scrEnd", "scrLive"].forEach((s) => $("#" + s).hidden = s !== id); }

/* ---------- preferencias de lectura ---------- */
let size = store.get("size", 22), theme = store.get("theme", "dark");
function applyLook() {
  document.documentElement.style.setProperty("--size", size + "px");
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#ffffff" : "#0a0a0a";
}
applyLook();
$("#smaller").onclick = () => { size = Math.max(16, size - 3); store.set("size", size); applyLook(); };
$("#bigger").onclick = () => { size = Math.min(48, size + 3); store.set("size", size); applyLook(); stick(); };
$("#theme").onclick = () => { theme = theme === "light" ? "dark" : "light"; store.set("theme", theme); applyLook(); };

/* ---------- arranque ---------- */
let code = (params.get("s") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
let room = null, lang = null;
applyI18n();
if (code) loadRoom(); else show("scrCode");

$("#codeForm").onsubmit = (e) => {
  e.preventDefault();
  code = $("#codeIn").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 6) { $("#codeMsg").textContent = t("notfound"); return; }
  const u = new URL(location.href); u.searchParams.set("s", code); history.replaceState(null, "", u);
  loadRoom();
};

async function loadRoom() {
  show("scrLoad");
  try {
    const r = await fetch(`${API}/room/${code}`);
    if (r.status === 404) throw Object.assign(new Error("404"), { nf: true });
    if (!r.ok) throw new Error("HTTP " + r.status);
    room = await r.json();
  } catch (err) {
    if (err.nf) { show("scrCode"); $("#codeIn").value = code; $("#codeMsg").textContent = t("notfound"); return; }
    show("scrCode"); $("#codeIn").value = code; $("#codeMsg").textContent = t("reconnecting");
    setTimeout(loadRoom, 3000); return;
  }
  document.title = room.title || "Traducción en vivo";
  if (room.ended) return showEnded();
  const keys = [...room.langs, ...(room.src ? ["src"] : [])];
  const prev = store.get("lang:" + code, null);
  if (prev && keys.includes(prev)) return join(prev); // recargó la página: vuelve a su idioma
  showPicker();
}

function showPicker() {
  disconnect();
  uiLang = T[deviceLang] ? deviceLang : "en";
  applyI18n();
  const keys = [...room.langs, ...(room.src ? ["src"] : [])];
  const pref = store.get("lastLang", deviceLang);
  $("#pickTitle").textContent = room.title || "";
  $("#pickTitle").hidden = !room.title;
  $("#pickLead").innerHTML = "";
  $("#pickLead").append(t("choose"));
  if (uiLang !== "en") { const s = document.createElement("span"); s.textContent = T.en.choose; $("#pickLead").append(s); }
  $("#langList").innerHTML = "";
  for (const k of keys) {
    const b = document.createElement("button");
    b.className = "lang" + (k === pref ? " was" : "");
    const name = document.createElement("span");
    if (k === "src") { name.textContent = t("original"); }
    else { name.textContent = NATIVE[k]; name.lang = k; }
    b.append(name);
    b.onclick = () => join(k);
    $("#langList").append(b);
  }
  show("scrPick");
}

function showEnded() {
  disconnect();
  $("#endTitle").textContent = room?.title || "";
  applyI18n();
  show("scrEnd");
}

/* ---------- conexión en vivo ---------- */
let ws = null, retry = 0, retryTimer = null, pingTimer = null, live = false, wantOpen = false;
function join(k) {
  lang = k;
  store.set("lang:" + code, k);
  if (k !== "src") { store.set("lastLang", k); uiLang = k; } else uiLang = T[deviceLang] ? deviceLang : "en";
  applyI18n();
  $("#feed").lang = k === "src" ? "" : k;
  $("#barTitle").textContent = room.title || "FaderLab";
  $("#lines").innerHTML = ""; $("#cur").textContent = "";
  show("scrLive");
  wantOpen = true; retry = 0;
  connect();
  keepAwake();
}
$("#changeLang").onclick = () => { store.set("lang:" + code, null); showPicker(); };

function setState(kind) {
  const dot = $("#dot"), name = lang === "src" ? t("original") : NATIVE[lang];
  if (kind === "reconnecting") { dot.className = "dot"; $("#barState").textContent = t("reconnecting"); return; }
  dot.className = "dot " + (live ? "live" : "wait");
  $("#barState").textContent = name + " · " + (live ? t("live") : t("paused"));
  updateNotice();
}
function updateNotice() {
  const empty = !$("#lines").childNodes.length && !$("#cur").textContent;
  $("#notice").textContent = empty ? t("waiting") : "";
}

function connect() {
  clearTimeout(retryTimer);
  const u = `${API.replace(/^http/, "ws")}/room/${code}/ws?lang=${encodeURIComponent(lang)}`;
  const sock = new WebSocket(u);
  ws = sock;
  setState("reconnecting");
  sock.onopen = () => {
    retry = 0;
    clearInterval(pingTimer);
    pingTimer = setInterval(() => { try { sock.send("ping"); } catch {} }, 25000);
  };
  sock.onmessage = (e) => {
    if (e.data === "pong") return;
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "init") {
      if (m.ended) { wantOpen = false; return showEnded(); }
      live = m.live;
      $("#lines").innerHTML = "";
      m.lines.forEach((l) => addLine(l.x));
      $("#cur").textContent = m.partial || "";
      setState(); stick(true);
    } else if (m.t === "d") {
      $("#cur").textContent += m.x; updateNotice(); stick();
    } else if (m.t === "s") {
      $("#cur").textContent = ""; addLine(m.x); stick();
    } else if (m.t === "live") {
      live = m.v; setState();
    } else if (m.t === "end") {
      wantOpen = false; showEnded();
    }
  };
  sock.onclose = () => {
    clearInterval(pingTimer);
    if (ws !== sock || !wantOpen) return;
    setState("reconnecting");
    retryTimer = setTimeout(connect, [400, 1000, 2000, 4000, 8000][Math.min(retry++, 4)]);
  };
}
function disconnect() {
  wantOpen = false; clearTimeout(retryTimer); clearInterval(pingTimer);
  const s = ws; ws = null; try { s?.close(); } catch {}
  releaseAwake();
}
function addLine(x) {
  const p = document.createElement("p"); p.textContent = x;
  $("#lines").append(p);
  while ($("#lines").childNodes.length > 200) $("#lines").firstChild.remove();
  updateNotice();
}

/* ---------- desplazamiento: sigue lo último salvo que el usuario esté leyendo arriba ---------- */
let follow = true;
const nearBottom = () => innerHeight + scrollY >= document.documentElement.scrollHeight - 140;
addEventListener("scroll", () => { follow = nearBottom(); $("#jump").hidden = follow || $("#scrLive").hidden; }, { passive: true });
function stick(force) {
  if (force) follow = true;
  if (follow) requestAnimationFrame(() => scrollTo(0, document.documentElement.scrollHeight));
}
$("#jump").onclick = () => { $("#jump").hidden = true; stick(true); };

/* ---------- pantalla encendida y regreso a la página ---------- */
let lock = null;
async function keepAwake() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch {} }
function releaseAwake() { try { lock?.release(); } catch {} lock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !wantOpen) return;
  keepAwake();
  if (!ws || ws.readyState > 1) { retry = 0; connect(); }
});
</script>
