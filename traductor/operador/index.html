<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<title>Operador · Traducción en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Entrada para el técnico de un cliente: solo su código de operador, nada técnico. */
:root{
  --bg:#0a0a0a; --bg2:#111; --bg3:#181818; --border:#242424;
  --accent:#e8a020; --accent2:#20c8e8; --text:#d4d4d4; --dim:#6a6a6a;
  --f-head:"Bebas Neue",Impact,sans-serif; --f-mono:"Share Tech Mono",ui-monospace,monospace; --f-ui:"DM Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:16px;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px 16px}
button,input{font:inherit;color:inherit}
.card{width:min(420px,100%);background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:26px 22px}
.brand{font-family:var(--f-head);font-size:20px;letter-spacing:.08em;color:var(--dim)}
.brand b{color:var(--accent);font-weight:400}
h1{font-size:26px;font-weight:700;margin:14px 0 6px;color:#fff;line-height:1.2}
p{margin:0 0 18px;color:#9a9a9a;line-height:1.5;font-size:15px}
label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:var(--f-mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
input:focus{outline:none;border-color:var(--accent)}
.go{width:100%;margin-top:14px;padding:14px;border-radius:10px;border:1px solid #6b4a10;background:linear-gradient(#2a1d06,#1a1204);color:var(--accent);font-family:var(--f-head);font-size:24px;letter-spacing:.12em;cursor:pointer}
.go:hover{border-color:var(--accent)}
.go:disabled{opacity:.5;cursor:wait}
.err{color:#ff7a6a;font-size:14px;min-height:1.4em;margin-top:12px}
.foot{margin-top:18px;font-size:12px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><b>FADER</b>LAB</div>
  <h1>Entrada de operador</h1>
  <p>Escribe el código de operador que te dieron para abrir la sala de traducción de tu evento.</p>
  <form id="f">
    <label for="code">Código de operador</label>
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" maxlength="20" required>
    <button class="go" id="go">ENTRAR</button>
  </form>
  <div class="err" id="err"></div>
  <div class="foot">Usa Chrome o Edge en la computadora que recibe el audio del evento. El público no necesita código: solo escanea el QR.</div>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const DEFAULT_WORKER = "https://traductor-api.faderlab.mx";
const params = new URLSearchParams(location.search);
// Solo en pruebas locales se acepta otro Worker por URL.
const API = (/^(localhost|127\.)/.test(location.hostname) && params.get("api")) ? params.get("api").replace(/\/+$/, "") : DEFAULT_WORKER;
const store = { set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

async function enter(code) {
  $("#go").disabled = true; $("#err").textContent = "";
  try {
    const r = await fetch(API + "/me", { headers: { "X-Access-Code": code } });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Error("Código incorrecto o revocado. Revisa que esté bien escrito o pide uno nuevo.");
    if (!r.ok) throw new Error(d.error || "No pude verificar el código (" + r.status + "). Revisa tu conexión.");
    store.set("trad.code", code);
    store.set("trad.workerUrl", API === DEFAULT_WORKER ? "" : API);
    const dest = new URL("../evento/", location.href);
    if (d.role === "operator") dest.searchParams.set("modo", "operador");
    location.replace(dest);
  } catch (err) {
    $("#err").textContent = err.message;
    $("#go").disabled = false;
  }
}
$("#f").onsubmit = (e) => { e.preventDefault(); const c = $("#code").value.trim(); if (c) enter(c); };

// Enlace directo: faderlab.mx/traductor/operador/#XXXX-XXXX-XXXX (lo que va después de # no viaja al servidor)
function fromLink() {
  const c = decodeURIComponent(location.hash.slice(1)).trim();
  if (!c) return false;
  history.replaceState(null, "", location.pathname + location.search); // no deja el código en la barra
  $("#code").value = c;
  enter(c);
  return true;
}
addEventListener("hashchange", fromLink);
if (!fromLink()) $("#code").focus();
</script>
</body>
</html>
