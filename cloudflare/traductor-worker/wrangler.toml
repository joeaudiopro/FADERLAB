name = "faderlab-traductor"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Subdominio propio en la zona faderlab.mx (ya está en Cloudflare).
# Si prefieres no usarlo, borra estas líneas y usa la URL *.workers.dev.
routes = [
  { pattern = "traductor-api.faderlab.mx", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "https://faderlab.mx,https://www.faderlab.mx,http://localhost:8080"

# Salas de evento (subtítulos por QR): un Durable Object por sala.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Secretos (no van aquí):
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ACCESS_CODE
